version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: depot_user
      POSTGRES_PASSWORD: depot_password
      POSTGRES_DB: depot_crm
    ports:
      - "5432:5432"
    volumes:
      - depot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depot_user -d depot_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://depot_user:depot_password@db:5432/depot_crm
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  depot_pgdata:
